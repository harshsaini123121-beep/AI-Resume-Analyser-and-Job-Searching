name: CI / Automated Testing, Quality, Security & Eval

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  # ---------------------------------------------------------------------------
  # 1. Code Quality, Security & Dependency Audit
  # ---------------------------------------------------------------------------
  lint_and_security:
    name: Lint, Type Check & Security Audit
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Cache dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-dev-${{ hashFiles('**/requirements*.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-dev-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-dev.txt

    - name: Run Ruff Linter
      run: |
        ruff check app frontend tests

    - name: Run Mypy Type Checking
      run: |
        mypy app --ignore-missing-imports

    - name: Run Pip-Audit Dependency Vulnerability Scan
      run: |
        pip-audit -r requirements.txt --ignore-vuln || true

    - name: Run Gitleaks Secret Scanner
      uses: gitleaks/gitleaks-action@v2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      continue-on-error: true

  # ---------------------------------------------------------------------------
  # 2. Automated Test Suite & Coverage Threshold Enforcement (>= 80%)
  # ---------------------------------------------------------------------------
  test_and_coverage:
    name: Pytest Suite & Coverage Verification (>= 80%)
    runs-on: ubuntu-latest
    needs: lint_and_security

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-dev.txt

    - name: Run Pytest with 80% Minimum Coverage Threshold
      run: |
        pytest tests/ -v --cov=app --cov-report=term-missing --cov-fail-under=80

  # ---------------------------------------------------------------------------
  # 3. ML Benchmark Regression & Documentation Sync Check
  # ---------------------------------------------------------------------------
  eval_regression_check:
    name: ML Model Benchmark Regression Guard
    runs-on: ubuntu-latest
    needs: test_and_coverage

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-dev.txt

    - name: Run Evaluation Benchmark
      run: |
        python evaluate_models.py

    - name: Verify Regression Thresholds (Spearman rho >= 0.85, MAE <= 15.0)
      run: |
        python -c "
        import json
        data = json.load(open('data/benchmark_results.json', encoding='utf-8'))
        metrics = data['final_reported_test_metrics']
        hybrid = [m for m in metrics if 'Hybrid' in m['model_architecture']][0]
        print(f'Hybrid Spearman rho: {hybrid[\"spearman_rho\"]}, MAE: {hybrid[\"mae\"]}')
        assert hybrid['spearman_rho'] >= 0.85, f'Regression: Spearman rho {hybrid[\"spearman_rho\"]} < 0.85'
        assert hybrid['mae'] <= 15.0, f'Regression: MAE {hybrid[\"mae\"]} > 15.0'
        print('ML Evaluation regression checks passed successfully!')
        "
